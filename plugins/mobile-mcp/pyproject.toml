[project]
name = "mobile-mcp"
version = "0.1.0"
description = "MCP server for Android phone control via ADB + android CLI (developers, Android Studio SDK)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
mobile-mcp = "main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "adb"]
