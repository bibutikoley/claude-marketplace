[project]
name = "mobile-mcp"
version = "0.2.0"
description = "Unified MCP server for Android (ADB) and iOS (Xcode simctl/devicectl) device control"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
mobile-mcp = "main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "android", "ios"]
