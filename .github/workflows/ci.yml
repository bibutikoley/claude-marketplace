name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/mobile-mcp/.claude-plugin/plugin.json plugins/mobile-mcp/.mcp.json plugins/apple-notes/.claude-plugin/plugin.json plugins/apple-notes/.mcp.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "OK: $f"
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace catalog
        run: python3 scripts/validate_marketplace.py

      - name: Compile plugins
        run: |
          python3 -m py_compile plugins/mobile-mcp/main.py plugins/mobile-mcp/android.py plugins/mobile-mcp/ios.py plugins/apple-notes/main.py plugins/apple-notes/notes.py

      - name: Install test deps
        run: pip install pytest mcp markdown markdownify

      - name: Run plugin tests
        run: python3 -m pytest plugins/mobile-mcp/tests plugins/apple-notes/tests -q

      - name: Install lint deps
        run: pip install ruff==0.14.5 mypy==1.18.1

      - name: Ruff check
        run: ruff check plugins/mobile-mcp plugins/apple-notes scripts

      - name: Ruff format check
        run: ruff format --check plugins/mobile-mcp plugins/apple-notes scripts

      - name: Mypy mobile-mcp
        run: python3 -m mypy main.py android.py ios.py
        working-directory: plugins/mobile-mcp

      - name: Mypy apple-notes
        run: python3 -m mypy main.py notes.py
        working-directory: plugins/apple-notes

  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
